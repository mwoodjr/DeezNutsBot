name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run register:check
      - run: npm audit --omit=dev
      - name: Install Gitleaks
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan source and history
        run: |
          "${{ runner.temp }}/bin/gitleaks" dir . --redact=100 --exit-code=1
          "${{ runner.temp }}/bin/gitleaks" git . --redact=100 --exit-code=1
